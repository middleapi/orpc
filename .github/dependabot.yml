version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      # pnpm requires minimumReleaseAge of 1, so the value below should be 1 or more
      default-days: 1
    versioning-strategy: increase
    groups:
      standard-server:
        patterns:
          - '@standard-server/*'
      openapi-spec:
        patterns:
          - '@openapi-spec/*'
      dev-dependencies-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
